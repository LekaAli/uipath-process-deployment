name: Package UiPath Process

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
env:
  CLI_VERSION:      '1.202.0'
  NODE_VERSION:     '22'
  OUTPUT_DIR:       $RUNNER_TEMP/uipath-packages
  ORCHESTRATOR_FOLDER: 'Processes'
  SOLUTION_OUT_DIR: 'uipath-solution-folder'
  PACKAGE_VERSION: 1.0.0-ci.${{ github.run_number }}
  
jobs:
  build-package:
    # Use Windows for standard Windows-targeted UiPath projects.
    runs-on: windows-latest
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: echo "version=1.0.0-ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      
      - name: Install UiPath CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"

          if ! command -v uip >/dev/null; then
            npm install -g "@uipath/cli@${CLI_VERSION}"
          fi
          uip --version
          
      - name: Authenticate
        shell: bash
        env:
          UIPATH_CLIENT_ID:     ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
          UIPATH_TENANT:        ${{ vars.UIPATH_TENANT }}
        run: |
          set -euo pipefail
          uip login \
            --client-id env.UIPATH_CLIENT_ID \
            --client-secret env.UIPATH_CLIENT_SECRET \
            --tenant "$UIPATH_TENANT"

      - name: Create package output directory
        id: pack
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/uipath-packages
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          echo "$OUTPUT_DIR"
      
      - name: Pack Package
        id: rpa
        shell: bash
        env:
          SOLUTION_DIR_NAME: "${{ github.event.repository.name }}-solution"
          PROCESS_OUT_DIR_PATH: "${{ runner.temp }}/${{ github.event.repository.name }}-solution"
        run: |
          set -euo pipefail
          uip solution init $PROCESS_OUT_DIR_PATH

          cp -r . "$PROCESS_OUT_DIR_PATH"

          ls -la "$PROCESS_OUT_DIR_PATH"

          uip solution project add "$PROCESS_OUT_DIR_PATH/${{ github.event.repository.name }}" "$PROCESS_OUT_DIR_PATH/${{ github.event.repository.name }}-solution.uipx"
        

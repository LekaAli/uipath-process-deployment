
name: Package UiPath Process

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
env:
  CLI_VERSION:      '1.202.0'
  NODE_VERSION:     '22'
  OUTPUT_DIR:       $RUNNER_TEMP/uipath-packages
  ORCHESTRATOR_FOLDER: 'Processes'
  PACKAGE_VERSION: 1.0.0-ci.${{ github.run_number }}
  
jobs:
  build-package:
    # Use Windows for standard Windows-targeted UiPath projects.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: echo "version=1.0.0-ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      
      - name: Install UiPath CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"

          if ! command -v uip >/dev/null; then
            npm install -g "@uipath/cli@${CLI_VERSION}"
          fi
          uip --version
          
      - name: Authenticate
        shell: bash
        env:
          UIPATH_CLIENT_ID:     ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
          UIPATH_TENANT:        ${{ vars.UIPATH_TENANT }}
        run: |
          set -euo pipefail
          uip login \
            --client-id env.UIPATH_CLIENT_ID \
            --client-secret env.UIPATH_CLIENT_SECRET \
            --tenant "$UIPATH_TENANT"

      - name: Create package output directory
        id: pack
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/uipath-packages
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          echo "$OUTPUT_DIR"
      
      - name: Pack Package
        id: rpa
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/uipath-packages
        run: |
          set -euo pipefail
          echo "$PACKAGE_VERSION"
          uip rpa pack . "$OUTPUT_DIR" --package-version $PACKAGE_VERSION
            ARTIFACT=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.nupkg" | head -1)
            echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: uipath-process-package
          path: ${{ runner.temp }}/uipath-packages/*.nupkg
          if-no-files-found: error
          retention-days: 7
  publish-deploy:
      name: Publish & Deploy
      needs: build-package
      runs-on: windows-latest
      environment: dev

      steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm global (@uipath/cli)
        uses: actions/cache@v4
        with:
          path: ~/.npm-global/lib/node_modules
          key:  uip-${{ env.CLI_VERSION }}-${{ runner.os }}
      
      - name: Install UiPath CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"

          if ! command -v uip >/dev/null; then
            npm install -g "@uipath/cli@${CLI_VERSION}"
          fi
          uip --version

      - uses: actions/download-artifact@v4
        with:
          name: uipath-process-package
          path: ${{ runner.temp }}/uipath-packages
          
      - name: Authenticate
        shell: bash
        env:
          UIPATH_CLIENT_ID:     ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
          UIPATH_TENANT:        ${{ vars.UIPATH_TENANT }}
        run: |
          set -euo pipefail
          uip login \
            --client-id env.UIPATH_CLIENT_ID \
            --client-secret env.UIPATH_CLIENT_SECRET \
            --tenant "$UIPATH_TENANT"

      - name: Publish to tenant feed
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/uipath-packages
        run: |
          set -euo pipefail
          ARTIFACT=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.nupkg" | head -1)
          uip rpa publish "$ARTIFACT"

      - name: Deploy Process
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/uipath-packages
        run: |
          set -eou pipefail
          PACKAGE_NAME=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.nupkg" | head -1)
          DEPLOYMENT_NAME=$(echo "$PACKAGE_NAME" | awk -F'/' '{print $NF}' | awk -F '.' '{print $1}')
          uip solution deploy run --name $DEPLOYMENT_NAME --package-name $PACKAGE_NAME --package-version $PACKAGE_VERSION --folder-name $ORCHESTRATOR_FOLDER
